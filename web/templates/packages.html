{{define "content"}}
<section class="container py-16">
    <div class="section-title">
        <h2>{{.Title}}</h2>
    </div>

    <form action="/packages" method="get" class="search-box mb-8" style="max-width:420px;">
        {{if .Region}}<input type="hidden" name="region" value="{{.Region}}">{{end}}
        <input type="text" name="q" value="{{.Query}}" placeholder="جست‌وجوی تور یا هتل ...">
        <button type="submit" aria-label="جست‌وجو">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="7"/>
                <path stroke-linecap="round" d="M21 21l-4.35-4.35"/>
            </svg>
        </button>
    </form>

    {{if .Packages}}
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
        {{range .Packages}}
        <a href="/packages/{{.Slug}}" class="card">
            <div class="card-image">
                {{if .CoverImage}}<img src="{{.CoverImage}}" alt="{{.Title}}">{{end}}
                {{if .IsInternational}}<span class="tag-badge">خارجی</span>{{else}}<span class="tag-badge">داخلی</span>{{end}}
            </div>
            <div class="card-body">
                <h3>{{.Title}}</h3>
                <div class="location">{{.Location}}</div>
                <div class="card-footer">
                    <div>
                        <div class="price-label">شروع قیمت از</div>
                        <div class="price">{{formatPrice .Price}} تومان</div>
                    </div>
                </div>
            </div>
        </a>
        {{end}}
    </div>
    {{else}}
    <p style="color:var(--ink-500)">موردی پیدا نشد.</p>
    {{end}}
</section>
{{end}}
