{{define "base"}}
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{if .Title}}{{.Title}} | مانادگشت{{else}}مانادگشت | دفتر خدمات مسافرتی{{end}}</title>

    <!-- فونت فارسی، اختیاری: اگه لود نشه (مثلا به‌خاطر محدودیت اینترنت)
         مرورگر خودکار میره سراغ فونت جایگزین Tahoma و ظاهر سایت خراب نمیشه -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- تمام استایل سایت این‌جاست، کاملاً محلی و بدون نیاز به اینترنت -->
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

    {{template "header" .}}

    <main class="flex-1">
        {{template "content" .}}
    </main>

    {{template "footer" .}}

    <!-- ویجت شناور تماس -->
    <div class="floating-widget">
        <a href="tel:01332007292" class="floating-btn call" title="تماس با ما" aria-label="تماس با ما">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/>
            </svg>
        </a>
        <a href="https://wa.me/989198355538" target="_blank" class="floating-btn whatsapp" title="واتساپ" aria-label="واتساپ">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
                <path d="M20.52 3.48A11.87 11.87 0 0012.03 0C5.5 0 .2 5.3.2 11.83c0 2.08.55 4.1 1.58 5.88L0 24l6.44-1.69a11.8 11.8 0 005.58 1.42h.01c6.53 0 11.83-5.3 11.83-11.83 0-3.16-1.23-6.13-3.34-8.42zM12.03 21.4a9.5 9.5 0 01-4.84-1.33l-.35-.2-3.82 1 1.02-3.72-.23-.38a9.55 9.55 0 01-1.47-5.07c0-5.27 4.29-9.56 9.57-9.56 2.56 0 4.96 1 6.77 2.81a9.5 9.5 0 012.8 6.76c0 5.28-4.29 9.57-9.45 9.57z"/>
            </svg>
        </a>
    </div>

    <script>
        // منوی موبایل
        document.getElementById('menu-btn')?.addEventListener('click', function () {
            document.getElementById('mobile-menu')?.classList.toggle('hidden');
        });
    </script>
</body>
</html>
{{end}}
