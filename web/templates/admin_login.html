{{define "content"}}
<div class="admin-login-card">
    <h1 class="text-2xl font-extrabold mb-6" style="text-align:center;">ورود به پنل ادمین</h1>

    {{if .Error}}<div class="alert-error">{{.Error}}</div>{{end}}

    <form method="post" action="/admin/login">
        <div class="form-group">
            <label>نام‌کاربری</label>
            <input type="text" name="username" value="{{.Username}}" required autofocus>
        </div>
        <div class="form-group">
            <label>رمز عبور</label>
            <input type="password" name="password" required>
        </div>
        <button type="submit" class="btn btn-green btn-block">ورود</button>
    </form>
</div>
{{end}}
