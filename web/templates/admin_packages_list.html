{{define "content"}}
<div class="admin-page-header">
    <h1 class="text-2xl font-extrabold">مدیریت تور/هتل</h1>
    <a href="/admin/packages/new" class="btn btn-green">+ تور/هتل جدید</a>
</div>

{{if .Packages}}
<div class="card" style="padding:1rem; overflow-x:auto;">
    <table class="simple-table">
        <thead>
            <tr><th>عنوان</th><th>نوع</th><th>قیمت</th><th>وضعیت</th><th></th></tr>
        </thead>
        <tbody>
            {{range .Packages}}
            <tr>
                <td>{{.Title}}</td>
                <td>{{.Type}}</td>
                <td>{{formatPrice .Price}}</td>
                <td>{{if .IsActive}}<span class="badge badge-paid">فعال</span>{{else}}<span class="badge badge-rejected">غیرفعال</span>{{end}}</td>
                <td class="admin-actions">
                    <a href="/admin/packages/{{.ID}}/edit" class="btn-sm">ویرایش</a>
                    <form method="post" action="/admin/packages/{{.ID}}/delete" onsubmit="return confirm('حذف بشه؟');">
                        <button type="submit" class="btn-sm btn-danger">حذف</button>
                    </form>
                </td>
            </tr>
            {{end}}
        </tbody>
    </table>
</div>
{{else}}
<p style="color:var(--ink-500)">هنوز چیزی ثبت نشده.</p>
{{end}}
{{end}}
