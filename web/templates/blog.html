{{define "content"}}
<section class="container py-16">
    <div class="section-title"><h2>وبلاگ مانادگشت</h2></div>

    {{if .Posts}}
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
        {{range .Posts}}
        <a href="/blog/{{.Slug}}" class="card">
            <div class="card-image">
                {{if .CoverImage}}<img src="{{.CoverImage}}" alt="{{.Title}}">{{end}}
            </div>
            <div class="card-body">
                <h3>{{.Title}}</h3>
                <p class="text-sm line-clamp-2 mt-2" style="color:var(--ink-500)">{{.Summary}}</p>
                <div class="mt-3"><span class="read-more">مطالعه بیشتر »</span></div>
            </div>
        </a>
        {{end}}
    </div>
    {{else}}
    <p style="color:var(--ink-500)">هنوز مطلبی منتشر نشده است.</p>
    {{end}}
</section>
{{end}}
