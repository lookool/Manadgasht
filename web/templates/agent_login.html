{{define "content"}}
<section class="container py-16">
    <div class="auth-card">
        <h1 class="text-2xl font-extrabold mb-6" style="text-align:center;">ورود همکاران</h1>

        {{if .Error}}<div class="alert-error">{{.Error}}</div>{{end}}

        <form method="post" action="/agent/login">
            <div class="form-group">
                <label>ایمیل</label>
                <input type="email" name="email" value="{{.Email}}" required>
            </div>
            <div class="form-group">
                <label>رمز عبور</label>
                <input type="password" name="password" required>
            </div>
            <button type="submit" class="btn btn-green btn-block">ورود</button>
        </form>

        <div class="auth-switch">
            هنوز همکار ما نشدی؟ <a href="/agent/register">ثبت‌نام کن</a>
        </div>
    </div>
</section>
{{end}}
